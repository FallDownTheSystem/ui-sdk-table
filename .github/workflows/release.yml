name: Release

on:
  push:
    branches: [master]
    # The docs app and the sink page change often and are no part of a
    # package, so only a push that changes a package can release.
    paths:
      - packages/**
  workflow_dispatch:
    inputs:
      publish_current:
        description: 'Publish the version that master has now, without release-please. Use it for a release that has a tag and is not on npm.'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run release-please (open the release pull request, or tag a merged one)
        if: ${{ github.event.inputs.publish_current != 'true' }}
        uses: googleapis/release-please-action@v5
        id: release1

      # The number comes from the output of release-please when this run opened
      # the pull request. The query is only for a pull request that an earlier
      # run left open, and it filters on the head branch: a filter on a label
      # goes through the search API, whose index is seconds behind.
      - name: Merge the open release pull request, if there is one
        if: ${{ github.event.inputs.publish_current != 'true' }}
        id: automerge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE1_PR: ${{ steps.release1.outputs.pr }}
          RELEASE1_PRS_CREATED: ${{ steps.release1.outputs.prs_created }}
        run: |
          set -uo pipefail
          PR_NUMBER=''

          if [ -n "${RELEASE1_PR:-}" ]; then
            PR_NUMBER=$(printf '%s' "$RELEASE1_PR" | jq -r '.number // empty')
            echo "release-please reported release pull request #${PR_NUMBER:-<none>}"
          fi

          if [ -z "$PR_NUMBER" ]; then
            if [ "${RELEASE1_PRS_CREATED:-}" = 'true' ]; then ATTEMPTS=5; else ATTEMPTS=1; fi
            for attempt in $(seq 1 "$ATTEMPTS"); do
              PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --base master \
                --json number,headRefName \
                -q 'map(select(.headRefName | startswith("release-please--branches--master"))) | .[0].number // empty')
              if [ -n "$PR_NUMBER" ]; then
                echo "Took the open release pull request #$PR_NUMBER of an earlier run"
                break
              fi
              echo "No open release pull request (attempt $attempt/$ATTEMPTS)"
              [ "$attempt" -lt "$ATTEMPTS" ] && sleep 3
            done
          fi

          if [ -z "$PR_NUMBER" ]; then
            if [ "${RELEASE1_PRS_CREATED:-}" = 'true' ]; then
              echo "::error::release-please created a release pull request, and it was not found for the merge."
              exit 1
            fi
            echo "No open release pull request: nothing to release."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Merging release pull request #$PR_NUMBER"
          gh pr merge "$PR_NUMBER" --squash --repo "$GITHUB_REPOSITORY"
          echo "merged=true" >> "$GITHUB_OUTPUT"

      - name: Run release-please again to tag the merged release
        if: ${{ github.event.inputs.publish_current != 'true' && steps.automerge.outputs.merged == 'true' }}
        uses: googleapis/release-please-action@v5
        id: release2

      - name: Decide whether to publish
        id: gate
        run: |
          if [ "${{ github.event.inputs.publish_current }}" = "true" ] || [ "${{ steps.release1.outputs.release_created }}" = "true" ] || [ "${{ steps.release2.outputs.release_created }}" = "true" ]; then
            echo "release_created=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_created=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.release_created == 'true'
        with:
          ref: master

      # Node 24 has npm 11, which Trusted Publishing needs. No cache: a cache
      # in a workflow that publishes is a way in for another workflow.
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.release_created == 'true'
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install pnpm and the dependencies
        if: steps.gate.outputs.release_created == 'true'
        run: |
          npm install -g "$(node -p "require('./package.json').packageManager")"
          pnpm install --frozen-lockfile

      - name: Format, lint, type-aware lint
        if: steps.gate.outputs.release_created == 'true'
        run: pnpm check

      - name: Type check
        if: steps.gate.outputs.release_created == 'true'
        run: pnpm type-check

      - name: Unit tests
        if: steps.gate.outputs.release_created == 'true'
        run: pnpm exec vp test run

      # `pnpm pack` writes the version of the core package in place of
      # `workspace:*`, and the versions of the catalog.
      - name: Pack the two packages
        if: steps.gate.outputs.release_created == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/packs"
          for dir in core vue; do
            (cd "packages/$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/packs")
          done
          ls -l "$RUNNER_TEMP/packs"

      # Pinned to npm 11: Trusted Publishing needs 11.5.1 or newer, and a
      # major version of npm is taken on purpose, not by `latest`.
      - name: Install an npm with Trusted Publishing
        if: steps.gate.outputs.release_created == 'true'
        run: npm install -g npm@11

      # The core package goes first, because the Vue package depends on its
      # version. A version that npm has already is left alone, so a run after
      # a failure between the two publishes the one that is missing.
      - name: Publish to npm (Trusted Publishing through OIDC)
        if: steps.gate.outputs.release_created == 'true'
        run: |
          set -euo pipefail
          for dir in core vue; do
            name=$(node -p "require('./packages/$dir/package.json').name")
            version=$(node -p "require('./packages/$dir/package.json').version")
            if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
              echo "$name@$version is on npm already."
              continue
            fi
            npm publish "$RUNNER_TEMP/packs/$name-$version.tgz" --access public
          done
