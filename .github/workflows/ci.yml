name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The release workflow merges its pull request within seconds, and runs
    # its own checks before it publishes.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - uses: actions/checkout@v7

      # Installs Vite+, its Node.js and pnpm, and the dependencies.
      - uses: voidzero-dev/setup-vp@v1
        with:
          cache: true

      - name: Format, lint, type-aware lint
        run: pnpm check

      - name: Type check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm exec vp test run

      - name: Install Chromium
        run: pnpm --filter docs exec playwright install --with-deps chromium

      - name: Browser tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

  # The repository has no branch rule that waits for the checks, so the merge
  # of an update is a job that runs after them.
  dependabot:
    name: Merge a minor or patch update
    needs: checks
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Read what the update changes
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A merge with the token of the workflow starts no other workflow, so the
      # docs site is deployed by a dispatch.
      - name: Merge a patch or minor update
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr merge --squash "$PR_URL"
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref master

      - name: Leave a major update for a review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: gh pr edit "$PR_URL" --add-label needs-review
